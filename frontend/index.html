<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Bento Blog</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="sobre.html" class="active">About</a>
    </nav>

    <div class="container">
        <h1>Welcome to TechBlog</h1>

        <div id="auth-section">
            <h2>Author Access</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="password" id="password" placeholder="Senha" required>
                <button type="submit">Log in to publish</button>
                <p>create account <a href="cadastro.html">here</a></p>
            </form>
        </div>

        <div id="logged-section" style="display: none;">
            <h2>You are connected.</h2>
            <p>Visit the Blog page to write new posts.</p>
            <button onclick="logout()">[Log Out]</button>
        </div>
    </div>
</body>
<script src="src/js/app.js"></script>
</html>
